<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<base target="_blank">
<title>方言調査 管理画面</title>
<style>
/* 方言調査 管理画面 — 見た目
 *
 * 参加者のサイト（かごしま ことばさんぽ）と同じ色・同じ決まりで作る：
 *   押せるもの（ボタン・えらんだメニュー）は「藍色の太い線＋下の影」、読むだけの面は「細い線」。
 * 進み具合は、すごろくのマスをならべた形で見せる。
 */
:root {
  color-scheme: light;
  --ink: #1D2B53;
  --ink-2: #4A5680;
  --ink-3: #5C6789;
  --sky: #E6F5F9;
  --plane: #F4F8FB;
  --card: #FFFFFF;
  --line: #D5DEEA;
  --line-2: #E8EDF4;
  --link: #0E5A75;
  --bay-pale: #D3EEF5;
  --mikan: #FF9A2E;
  --leaf: #37B679;
  --leaf-pale: #DCF5E7;
  --sun: #FFD84D;
  --sun-pale: #FFF3BF;
  --rec: #D13B40;
  --rec-deep: #B4232A;
  --rec-pale: #FFE4E5;
  --ash: #C9CEDA;
  --ash-pale: #EEF1F6;
  /* グラフの色。色覚のちがいがあっても、どの2色がとなり合っても見分けられる組み合わせを、道具で確かめたもの */
  --series-1: #1284B0;
  --series-2: #EB6834;
  --series-3: #1BAF7A;
  --series-4: #6250D6;
  --grid: #E3EAF2;
  --axis: #BCC8D8;
  --drop: 0 3px 0 var(--ink);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
/* scroll-padding：Tab キーで下のほうの入力欄へ移ったとき、画面の下にとどまる「保存」の帯のうしろに、かくれないようにする */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-bottom: 116px; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere; line-break: strict;
}
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--link); }
:focus-visible { outline: 3px solid #2AA9C9; outline-offset: 2px; }
.icon { display: block; width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.nowrap { white-space: nowrap; }

/* ---------- 骨組み ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side {
  position: sticky; top: 0; align-self: start; height: 100vh; height: 100dvh; overflow-y: auto;
  display: flex; flex-direction: column; padding: 18px 14px 14px;
  background: var(--sky); border-right: 2px solid var(--ink);
}
.brand { display: flex; align-items: center; padding: 0 6px 14px; }
.brand__mark { width: 46px; flex: none; margin-right: 10px; }
.brand__mark svg { display: block; width: 100%; height: auto; }
.brand__name { font-weight: 700; font-size: 17px; line-height: 1.3; }
.brand__sub { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.side__site { margin: 0 2px 16px; }
.side__site .btn { width: 100%; }
.nav { display: grid; gap: 6px; }
.nav__item {
  display: flex; align-items: center; width: 100%; padding: 9px 12px;
  border: 2px solid transparent; border-radius: 12px; background: transparent;
  text-align: left; font-weight: 700; font-size: 15px; color: var(--ink);
}
.nav__item:hover:not(:disabled) { background: rgba(255, 255, 255, .65); }
.nav__item[aria-current="page"] { background: #fff; border-color: var(--ink); box-shadow: var(--drop); }
.nav__item:disabled, .tabs__item:disabled { opacity: .45; }
.nav__icon { flex: none; margin-right: 10px; }
.side__foot { margin-top: auto; padding-top: 18px; display: grid; gap: 2px; font-size: 13.5px; }
.side__link { display: flex; align-items: center; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; white-space: nowrap; }
.side__link:hover { background: rgba(255, 255, 255, .65); }
.side__link .icon { width: 18px; height: 18px; margin-right: 8px; flex: none; }
.side__ver { padding: 8px 8px 0; color: var(--ink-2); font-size: 12px; }
.main { min-width: 0; padding: 26px 30px 64px; }
.main__inner { max-width: 1180px; margin: 0 auto; }
.is-loading .main__inner { opacity: .62; transition: opacity 200ms ease; }
.tabs { display: none; }
.app[data-mode="dialog"] { grid-template-columns: 212px minmax(0, 1fr); }
.app[data-mode="dialog"] .main { padding: 18px 20px 40px; }
.app[data-mode="dialog"] .side { padding-left: 12px; padding-right: 12px; }
.app[data-mode="dialog"] .side__foot { font-size: 13px; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 6px 16px;
  border: 2px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink);
  box-shadow: var(--drop); font-weight: 700; font-size: 14.5px; line-height: 1.3; text-decoration: none; white-space: nowrap;
  transition: transform 70ms ease, box-shadow 70ms ease;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn--primary { background: var(--mikan); }
.btn--danger { background: var(--rec-pale); }
.btn--small { min-height: 32px; padding: 3px 11px; font-size: 13px; border-radius: 10px; box-shadow: 0 2px 0 var(--ink); }
.btn--small:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { background: var(--ash-pale); color: var(--ink-3); border-color: var(--ash); box-shadow: 0 3px 0 var(--ash); }
.btn--small:disabled { box-shadow: 0 2px 0 var(--ash); }
.btn .icon { width: 18px; height: 18px; margin-right: 6px; }
.btn--small .icon { width: 15px; height: 15px; margin-right: 5px; }
.textbtn {
  display: inline-flex; align-items: center; padding: 2px 6px; margin: 0 -6px; border: 0; border-radius: 6px; background: none;
  color: var(--link); font-weight: 700; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap;
}
.textbtn:hover:not(:disabled) { background: var(--bay-pale); }
.textbtn:disabled { color: var(--ink-3); text-decoration: none; }
.textbtn .icon { width: 15px; height: 15px; margin-right: 4px; }
.spin { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 見出し・カード ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 18px; }
.head__title { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: .01em; outline: none; }
.head__sub { margin-top: 2px; color: var(--ink-2); font-size: 14px; }
.head__tools { display: flex; align-items: center; gap: 10px; }
.head__time { color: var(--ink-2); font-size: 13px; }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.grid--tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid--2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.grid--1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px; min-width: 0; }
.card__head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
.card__title { font-size: 16px; font-weight: 700; }
.card__tools { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.card__note { margin-top: 12px; color: var(--ink-2); font-size: 13px; }
.empty { padding: 22px 8px; text-align: center; color: var(--ink-2); font-size: 14px; }

/* ---------- 数字のカード ---------- */
.tile { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 15px 18px 14px; min-width: 0; }
.tile__label { color: var(--ink-2); font-size: 13.5px; font-weight: 700; }
.tile__value { display: flex; align-items: baseline; margin-top: 1px; font-size: 32px; line-height: 1.3; font-weight: 700; letter-spacing: .01em; }
.tile__unit { font-size: 16px; margin-left: 3px; }
.tile__value--state { align-items: center; font-size: 26px; line-height: 1.6; }
.tile__sub { margin-top: 1px; color: var(--ink-2); font-size: 13px; }
.dot { flex: none; width: 14px; height: 14px; margin-right: 9px; border-radius: 50%; border: 2px solid var(--ink); background: var(--leaf); }
.dot--stop { background: var(--rec); border-radius: 3px; }

/* ---------- 知らせ ---------- */
.notice { display: flex; align-items: flex-start; padding: 12px 14px; border: 1.5px solid #B9DCE8; border-radius: 14px; background: var(--sky); font-size: 14px; }
.notice .icon { flex: none; margin: 1px 10px 0 0; }
.notice--bad { background: var(--rec-pale); border: 2px solid var(--rec-deep); }
.notice--new { background: var(--leaf-pale); border-color: #9AD8B7; align-items: center; margin-bottom: 14px; }
.notice--new .icon { margin-top: 0; }
.notice__grow { flex: 1 1 auto; min-width: 0; }
.notice .btn { flex: none; margin-left: 12px; }
.flags { display: flex; flex-wrap: wrap; gap: 10px; }
.flag {
  display: inline-flex; align-items: center; padding: 5px 13px 5px 10px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--sun-pale); box-shadow: 0 2px 0 var(--ink);
  font-weight: 700; font-size: 13.5px;
}
.flag:active { transform: translateY(2px); box-shadow: none; }
.flag .icon { width: 17px; height: 17px; margin-right: 6px; }

/* ---------- 小さな札 ---------- */
.pid {
  display: inline-block; flex: none; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--sky);
  font-weight: 700; font-size: 13px; line-height: 21px; letter-spacing: .03em; font-variant-numeric: tabular-nums; white-space: nowrap;
  max-width: 13em; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
button.pid:hover { background: #fff; }
.chip {
  display: inline-flex; align-items: center; flex: none; padding: 0 9px; border: 1.5px solid var(--ink-2); border-radius: 999px; background: #fff;
  font-size: 12.5px; font-weight: 700; line-height: 21px; white-space: nowrap;
}
.chip .icon { width: 13px; height: 13px; margin-right: 4px; }
.chip--ok { background: var(--leaf-pale); border-color: var(--ink); }
.chip--warn { background: var(--sun-pale); border-color: var(--ink); }
.chip--stop { background: var(--rec-pale); border-color: var(--rec-deep); }
.chip--mute { background: var(--ash-pale); border-color: var(--ash); color: var(--ink-2); }

/* ---------- すごろくのマス（進み具合） ---------- */
.strip { display: inline-flex; flex: none; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.strip__cell { position: relative; flex: none; width: 17px; height: 17px; border-radius: 5px; background: var(--ash-pale); border: 1.5px solid var(--ash); overflow: hidden; }
.strip__cell[data-state="done"] { background: var(--leaf); border-color: var(--ink); }
.strip__cell[data-state="part"] { background: #fff; border-color: var(--ink-2); }
.strip__cell[data-state="part"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--part, 50%); background: var(--leaf); opacity: .6; }
.progress { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.table .progress { flex-wrap: nowrap; }
.progress__count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- グラフ ---------- */
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--ash-pale); }
.seg__btn { border: 0; background: transparent; padding: 3px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg__btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); }
.card--chart { display: flex; flex-direction: column; }
#chart-plot { flex: 1 1 auto; min-height: 224px; }
.chart { position: relative; outline: none; border-radius: 8px; }
.chart:focus-visible { box-shadow: 0 0 0 3px #2AA9C9; }
.chart svg { display: block; }
.chart text { font-family: var(--font); font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart text.chart__none { font-size: 13.5px; fill: var(--ink-2); }
.chart__bar { fill: var(--series-1); }
.chart__bar[data-on="true"] { fill: #0C6A90; }
.chart__tip {
  position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, -100%);
  padding: 5px 10px 6px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.45; white-space: nowrap; text-align: center;
}
.chart__tip strong { display: block; font-size: 15px; }
.chart__table { max-height: 232px; overflow-y: auto; }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px; max-height: 452px; overflow-y: auto; }
.steprow__label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 13.5px; }
.steprow__name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
.steprow__val { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter { height: 12px; border-radius: 6px; background: var(--bay-pale); overflow: hidden; }
.meter__fill { height: 100%; min-width: 0; background: var(--series-1); border-radius: 0 6px 6px 0; }

/* ---------- 一覧 ---------- */
.list__row { padding: 11px 0; border-top: 1.5px solid var(--line-2); }
.list__row:first-child { border-top: 0; padding-top: 2px; }
.list__row:last-child { padding-bottom: 2px; }
.list__top { display: flex; align-items: center; gap: 8px; }
.list__grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 13.5px; }
.list__time { flex: none; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.list__main { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; }
.answer { font-weight: 700; font-size: 15.5px; }
.answer__sub { display: block; margin-top: 2px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.audio { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.playbtn {
  display: inline-flex; align-items: center; min-height: 30px; padding: 2px 11px 2px 8px;
  border: 2px solid var(--ink); border-radius: 999px; background: #fff; box-shadow: 0 2px 0 var(--ink);
  font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.playbtn:active { transform: translateY(2px); box-shadow: none; }
.playbtn .icon { width: 15px; height: 15px; margin-right: 5px; }
.playbtn[data-state="playing"] { background: var(--mikan); }
.playbtn[data-state="loading"] { color: var(--ink-2); }

/* ---------- 表 ----------
 * 表の中に、もうひとつ小さな表（文節ごとの回答）が入ることがあるので、決まりは「すぐ下の子」だけに当てる。 */
.tablewrap { position: relative; overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table > thead > tr > th { text-align: left; vertical-align: middle; font-size: 12.5px; color: var(--ink-2); font-weight: 700; padding: 6px 10px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.table > tbody > tr > td { padding: 11px 10px; border-bottom: 1.5px solid var(--line-2); vertical-align: top; }
.table > tbody > tr:last-child > td { border-bottom: 0; }
.table > thead > tr > th:first-child, .table > tbody > tr > td:first-child { padding-left: 0; }
.table > thead > tr > th:last-child, .table > tbody > tr > td:last-child { padding-right: 0; }
.table > thead > tr > .right, .table > tbody > tr > .right { text-align: right; }
.table > tbody > tr[data-off="true"] > td { background: #FAFBFD; }
.cell-q { min-width: 180px; max-width: 320px; }
.cell-q__id, .subline { display: block; margin-top: 2px; color: var(--ink-3); font-size: 12.5px; }
.cell-a { min-width: 160px; max-width: 340px; }
.table > tbody > tr.detail > td { background: #FAFCFE; padding: 14px 16px 16px; }
.detail__box > * + * { margin-top: 14px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin-right: 14px; }
.kv__parts { display: flex; flex-wrap: wrap; gap: 0 14px; }
.segs__wrap { overflow-x: auto; }
.segs { border-collapse: collapse; font-size: 14px; background: #fff; }
.segs th, .segs td { border: 1.5px solid var(--line); padding: 5px 12px; text-align: center; white-space: nowrap; }
.segs th { background: var(--ash-pale); font-weight: 500; color: var(--ink-2); font-size: 13px; }
.segs td { font-weight: 700; }
.detail__links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.pager { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1.5px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); }
.pager__btns { display: flex; gap: 10px; }
.table--items { table-layout: fixed; }
.table--items .col-n { width: 96px; }
.table--items .col-bar { width: 30%; }
.table--items .col-go { width: 96px; }
.table--items .cell-q { max-width: none; }
.stackbar { display: flex; height: 12px; min-width: 120px; }
.stackbar__seg { height: 100%; margin-right: 2px; }
.stackbar__seg:first-child { border-radius: 4px 0 0 4px; }
.stackbar__seg:last-child { margin-right: 0; border-radius: 0 4px 4px 0; }
.stackbar__seg:only-child { border-radius: 4px; }
.stackbar--none { background: var(--ash-pale); border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.legend__item { display: inline-flex; align-items: center; }
.legend__key { width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }
.breakdown { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.stephead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 22px 0 6px; }
.stephead:first-child { margin-top: 0; }
.stephead__title { font-size: 15px; font-weight: 700; }

/* 表が横に入りきらないとき・スマートフォンでは、1行を1枚のカードの形にする（JavaScript が is-stacked を付ける） */
.table--stack.is-stacked > thead { display: none; }
.pickall.pickall--stack { display: none; }
.has-stacked > .pickall.pickall--stack { display: flex; padding: 2px 0 12px; border-bottom: 1.5px solid var(--line-2); font-size: 13.5px; font-weight: 700; }
.table--stack.is-stacked, .table--stack.is-stacked > tbody, .table--stack.is-stacked > tbody > tr, .table--stack.is-stacked > tbody > tr > td { display: block; }
.table--stack.is-stacked { table-layout: auto; }
.table--stack.is-stacked > tbody > tr { padding: 12px 0; border-bottom: 1.5px solid var(--line-2); }
.table--stack.is-stacked > tbody > tr:last-child { border-bottom: 0; }
.table--stack.is-stacked > tbody > tr > td { padding: 3px 0; border: 0; max-width: none; min-width: 0; width: auto; }
.table--stack.is-stacked > tbody > tr > td:empty { display: none; }
.table--stack.is-stacked > tbody > tr > td[data-label] { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: start; justify-items: start; }
.table--stack.is-stacked > tbody > tr > td[data-label]::before { content: attr(data-label); color: var(--ink-2); font-size: 12.5px; padding-top: 2px; }
.table--stack.is-stacked > tbody > tr > td[data-label] > .grow { justify-self: stretch; }
.table--stack.is-stacked > tbody > tr > td.right { text-align: left; }
.table--stack.is-stacked > tbody > tr.detail { border-bottom: 1.5px solid var(--line-2); padding: 0 0 12px; }
.table--stack.is-stacked > tbody > tr.detail > td { padding: 12px; border-radius: 12px; }
.table--stack.is-stacked .rowactions { justify-content: flex-start; }
.table--stack.is-stacked .progress { flex-wrap: wrap; }
/* 参加者の表：あまった幅は、メモの列に回す（メモを読みやすく、書きやすくする） */
.table--people:not(.is-stacked) > tbody > tr > td.c-memo { width: 36%; }
/* 回答：1件を、ひとまとまりの小さなカードにする */
.table--answers.is-stacked > tbody > tr.arow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.table--answers.is-stacked .c-pid { order: 1; align-self: flex-start; }
.table--answers.is-stacked .c-q { order: 2; flex: 1 1 0; align-self: flex-start; color: var(--ink-2); font-size: 13.5px; }
.table--answers.is-stacked .c-time { order: 3; align-self: flex-start; color: var(--ink-2); font-size: 12.5px; }
.table--answers.is-stacked .c-a { order: 4; flex: 0 0 100%; }

<div id="app" class="app"></div>
<div id="layer" class="layer"></div>

<script>
/*
 * QRコードを作る（参加者カードに、サイトのアドレスを印刷するため）。
 * 外の部品は読みこまず、ここに書いてあるものだけで作る。
 * 8ビットの文字・誤り訂正レベル M・型番 1〜10（半角で 213 文字まで）に対応。
 */
var KSQR = (function () {
  'use strict';
  // 型番 1〜10、誤り訂正レベル M のときの決まった数（JIS X 0510 の表から）
  var ECC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];          // 1ブロックあたりの誤り訂正の語数
  var BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];                  // ブロックの数
  var RAW = [0, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346];    // 全体の語数
  var ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];

  // 誤り訂正（リード・ソロモン符号）
  function mul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function divisor(degree) {
    var result = [], root = 1, i, j;
    for (i = 0; i < degree - 1; i++) result.push(0);
    result.push(1);
    for (i = 0; i < degree; i++) {
      for (j = 0; j < result.length; j++) {
        result[j] = mul(result[j], root);
        if (j + 1 < result.length) result[j] ^= result[j + 1];
      }
      root = mul(root, 2);
    }
    return result;
  }
  function remainder(data, div) {
    var result = [], i, k;
    for (i = 0; i < div.length; i++) result.push(0);
    for (k = 0; k < data.length; k++) {
      var factor = data[k] ^ result.shift();
      result.push(0);
      for (i = 0; i < div.length; i++) result[i] ^= mul(div[i], factor);
    }
    return result;
  }

  function utf8(text) {
    var s = unescape(encodeURIComponent(String(text))), out = [];
    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
    return out;
  }
  function capacity(version) { return RAW[version] - ECC[version] * BLOCKS[version]; }
  function fits(count, version) { return 4 + (version < 10 ? 8 : 16) + count * 8 <= capacity(version) * 8; }

  // 文字を、データの語の列にする
  function dataCodewords(bytes, version) {
    var total = capacity(version) * 8, bits = [], i, j;
    function put(value, len) { for (var n = len - 1; n >= 0; n--) bits.push((value >>> n) & 1); }
    put(4, 4);                                                    // 8ビットの文字のしるし
    put(bytes.length, version < 10 ? 8 : 16);
    for (i = 0; i < bytes.length; i++) put(bytes[i], 8);
    put(0, Math.min(4, total - bits.length));                     // 終わりのしるし
    put(0, (8 - bits.length % 8) % 8);
    for (var pad = 0xEC; bits.length < total; pad ^= 0xEC ^ 0x11) put(pad, 8);
    var out = [];
    for (i = 0; i < bits.length; i += 8) {
      var b = 0;
      for (j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      out.push(b);
    }
    return out;
  }
  // ブロックに分けて誤り訂正の語を付け、決まった順にまぜる
  function interleave(data, version) {
    var numBlocks = BLOCKS[version], eccLen = ECC[version], raw = RAW[version];
    var numShort = numBlocks - raw % numBlocks, shortLen = Math.floor(raw / numBlocks);
    var blocks = [], div = divisor(eccLen), k = 0, i, j;
    for (i = 0; i < numBlocks; i++) {
      var dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
      k += dat.length;
      var ecc = remainder(dat, div);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var result = [];
    for (i = 0; i < blocks[0].length; i++) {
      for (j = 0; j < blocks.length; j++) {
        if (i !== shortLen - eccLen || j >= numShort) result.push(blocks[j][i]);
      }
    }
    return result;
  }

  var MASKS = [
    function (x, y) { return (x + y) % 2 === 0; },
    function (x, y) { return y % 2 === 0; },
    function (x, y) { return x % 3 === 0; },
    function (x, y) { return (x + y) % 3 === 0; },
    function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; },
    function (x, y) { return x * y % 2 + x * y % 3 === 0; },
    function (x, y) { return (x * y % 2 + x * y % 3) % 2 === 0; },
    function (x, y) { return ((x + y) % 2 + x * y % 3) % 2 === 0; }
  ];

  // 読みとりにくい模様（同じ色の続き・かたまり・目印に似た並び・白黒のかたより）ほど、点が高くなる
  function penalty(m) {
    var size = m.length, score = 0, dark = 0, x, y, run, line, col;
    function runs(cells) {
      var total = 0, len = 1;
      for (var i = 1; i <= cells.length; i++) {
        if (i < cells.length && cells[i] === cells[i - 1]) { len++; continue; }
        if (len >= 5) total += len - 2;
        len = 1;
      }
      return total;
    }
    function finderLike(cells) {
      var text = '', n = 0, at;
      for (var i = 0; i < cells.length; i++) text += cells[i] ? '1' : '0';
      for (at = text.indexOf('10111010000'); at >= 0; at = text.indexOf('10111010000', at + 1)) n++;
      for (at = text.indexOf('00001011101'); at >= 0; at = text.indexOf('00001011101', at + 1)) n++;
      return n * 40;
    }
    for (y = 0; y < size; y++) {
      line = m[y]; col = [];
      for (x = 0; x < size; x++) { col.push(m[x][y]); if (m[y][x]) dark++; }
      score += runs(line) + runs(col) + finderLike(line) + finderLike(col);
    }
    for (y = 0; y < size - 1; y++) {

    if (d.added.length) parts.push(h('details', { class: 'morebox', open: d.added.length <= 20 }, h('summary', { class: 'morebox__sum', text: '新しく足す設問（' + d.added.length + '）' }),
      miniTable(['設問ID', '提示語・例文', '歩'], few(d.added, 60, function (r) { return h('tr', {}, h('td', { text: r.id }), h('td', { text: r.prompt }), h('td', { class: 'num', text: r.step + '歩目' })); }))));
    if (plan.steps && plan.steps.length) parts.push(h('p', { class: 'field__hint', text: '歩の名前：' + plan.steps.map(function (s) { return s.no + '歩目「' + s.title + '」'; }).join('、') }));
    var applyBtn = h('button', { type: 'button', class: 'btn btn--primary', id: 'import-apply', disabled: !plan.ok || im.applying, onclick: applyImport }, im.applying ? '取りこんでいます…' : 'この内容で取りこむ');
    parts.push(h('div', { class: 'linkrow', style: 'margin-top:16px;align-items:center' }, applyBtn,
      h('span', { class: 'muted', style: 'font-size:13.5px', text: plan.ok ? '取りこむ前に、いまの「項目」「歩」シートの控えをとります。' : '上の「直すところ」を直してから、もう一度「下見する」を押してください。' })));
    return h('section', { class: 'card', id: 'plan' },
      h('div', { class: 'card__head' }, h('h2', { class: 'card__title', id: 'plan-title', tabindex: '-1', text: '3. 下見：' + (plan.ok ? 'このように変わります' : '取りこめません') })),
      h('div', { class: 'stack' }, parts));
  }
  function applyImport() {
    var im = state.items.importing;
    if (!im.plan || !im.plan.ok || im.applying) return;
    var d = im.plan.diff, c = im.plan.counts;
    var risky = (c.answersTouched > 0) || d.removed.length > 0;
    var go = function () {
      im.applying = true; im.error = '';
      render();
      mutate('importItems', { head: im.table.head, rows: im.table.rows, steps: im.steps, mode: im.mode, confirm: true }).then(function (res) {
        var done = res.written + ' 件を取りこみました' + (res.hiddenKept ? '（回答のある ' + res.hiddenKept + ' 件は「出さない」にして残しました）' : '') + '。' +
          (res.backups && res.backups.length ? '控え：' + res.backups.join('、') + '。' : '');
        state.items.importing = blankImport();                 // 次に開いたときは、まっさらな状態から
        loadOverview().then(function () { show('items'); toast(done); }, function (err) { if (!failed(err, true)) { show('items'); toast('取りこめましたが、新しい内容を読みこめませんでした。あとで「更新」を押してください。'); } });
      }, function (err) {
        im.applying = false;
        if (failed(err, true)) return;
        im.error = err.message;
        im.plan = null;
        render();
      });
    };
    if (!risky) { go(); return; }
    var lines = [];
    if (c.answersTouched > 0) lines.push('回答のある設問の文が変わります（回答 ' + c.answersTouched + ' 件）。');
    if (d.removed.length) lines.push(d.removed.length + ' 件の設問が一覧から消えます' + (d.removed.some(function (r) { return r.kept; }) ? '（回答のあるものは「出さない」にして残します）' : '') + '。');
    lines.push('取りこむ前に、いまの「項目」「歩」シートの控えをとります。');
    dialog({ title: 'この内容で取りこみますか？', body: h('div', {}, lines.map(function (t) { return h('p', { text: t }); })),
      actions: [{ label: 'やめる', value: 0 }, { label: '取りこむ', value: 1, kind: 'danger' }] }).then(function (v) { if (v === 1) go(); });
  }

  /* ============================================================
   * 設定
   * ============================================================ */
  var SETTING_KEYS = { notice: 'お知らせ', instruction: '教示文', wordQuestion: '語彙の質問文', sentenceQuestion: '例文の質問文',
    maxRecordSec: '録音の上限（秒）', noiseWarnDb: '雑音の注意の目安（dB）', idPrefix: '参加者ナンバーの頭文字', siteUrl: 'サイトのURL' };
  VIEWS.settings = function () {
    var st = state.settings, s = D.settings;
    if (!st.draft) { st.draft = {}; st.touched = bag(); st.dirty = false; st.message = ''; st.bad = false; }
    // 自分で書きかえていない欄には、いつも保存先のいまの内容を出す（書きかえた欄は、書いたままにしておく）
    for (var k in SETTING_KEYS) if (!st.touched[k]) st.draft[k] = String(s[k] == null ? '' : s[k]);
    var saveBtn = h('button', { type: 'button', class: 'btn btn--primary', id: 'settings-save', disabled: !st.dirty || st.saving, onclick: saveSettings }, st.saving ? '保存しています…' : '保存する');
    var msg = h('span', { class: 'savebar__msg' + (st.bad ? ' savebar__msg--bad' : ''), id: 'settings-msg', role: 'status', tabindex: '-1',
      text: st.saving ? '' : (st.message || (st.dirty ? 'まだ保存していない変更があります。' : '変更はありません。')) });
    function changed(key, value) {
      st.draft[key] = value; st.touched[key] = true; st.dirty = true; st.message = ''; st.bad = false;
      saveBtn.disabled = false;
      msg.className = 'savebar__msg'; msg.textContent = 'まだ保存していない変更があります。';
    }
    function field(key, label, hint, kind, extra) {
      var id = 'set-' + key, input;
      // 保存しているあいだは、書きかえられないようにする（送ったものと、画面に見えているものが食いちがわないように）
      var attrs = { id: id, class: kind === 'textarea' ? 'textarea' : 'input' + (kind === 'number' || kind === 'short' ? ' input--narrow' : ''), disabled: st.saving, oninput: function (e) { changed(key, e.target.value); } };
      if (extra) for (var a in extra) attrs[a] = extra[a];
      if (kind === 'textarea') { input = h('textarea', attrs); input.value = st.draft[key]; }
      else { attrs.type = kind === 'url' ? 'url' : 'text'; attrs.value = st.draft[key]; input = h('input', attrs); }
      return h('div', { class: 'field' }, h('label', { class: 'field__label', for: id, text: label }), input, hint ? h('p', { class: 'field__hint', text: hint }) : null);
    }
    return h('div', { class: 'stack' },
      head('設定', '受付の開始・停止や、参加者の画面に出す文章を変えられます。'),
      openCard(),
      h('section', { class: 'card' },
        h('div', { class: 'card__head' }, h('h2', { class: 'card__title', text: '参加者の画面に出す文章' })),
        field('notice', 'お知らせ', '書くと、参加者の地図の画面の上に出ます。空欄なら何も出ません。', 'textarea', { maxlength: '300' }),
        field('instruction', '教示文', 'すべての設問の上に出る説明です。', 'textarea', { maxlength: '400' }),
        field('wordQuestion', '語彙の質問文', '{語} のところに、提示語が入ります。', 'text', { maxlength: '200' }),
        field('sentenceQuestion', '例文の質問文', '{文} のところに、例文が入ります。', 'text', { maxlength: '200' })),
      h('section', { class: 'card' },
        h('div', { class: 'card__head' }, h('h2', { class: 'card__title', text: '録音' })),
        field('maxRecordSec', '録音の上限（秒）', '1回の録音の長さの上限です（5〜60）。長くすると、通信のおそい場所では送信に時間がかかります。', 'number', { maxlength: '3', inputmode: 'numeric', autocomplete: 'off' }),
        field('noiseWarnDb', '雑音の注意の目安（dB）', '声と、まわりの音の大きさの差がこの数字より小さい録音に、注意を出します（5〜40）。数字を大きくすると、きびしくなります。0 にすると注意を出しません。', 'number', { maxlength: '3', inputmode: 'numeric', autocomplete: 'off' })),
      h('section', { class: 'card' },
        h('div', { class: 'card__head' }, h('h2', { class: 'card__title', text: '参加者の登録' })),
        field('idPrefix', '参加者ナンバーの頭文字', '「参加者を追加」で自動的に作るナンバーの頭文字です（半角の英数字1〜4文字）。', 'short', { maxlength: '4', autocapitalize: 'characters' }),
        field('siteUrl', 'サイトのURL', '参加者に案内するサイトのアドレスです。「参加者の画面を開く」と、参加者カードの印刷に使います。', 'url', { maxlength: '200', placeholder: 'https://' })),
      h('div', { class: 'savebar' }, h('div', { class: 'savebar__box' }, saveBtn, msg)),
      h('section', { class: 'card' },
        h('div', { class: 'card__head' }, h('h2', { class: 'card__title', text: 'データの置き場所' })),
        h('div', { class: 'linkrow' },
          httpsLink(D.links.spreadsheet, { class: 'btn btn--small' }, h('span', { svg: ICON.sheet }), 'スプレッドシートを開く'),
          httpsLink(D.links.audioFolder, { class: 'btn btn--small' }, h('span', { svg: ICON.folder }), '録音フォルダを開く'),
          siteButton('btn btn--small')),
        h('p', { class: 'card__note', text: '回答は「' + D.name + '」の「回答」シートに、録音は録音フォルダに入っています。プログラムのバージョンは ' + D.version + ' です。' })));
  };
  function saveSettings() {
    var st = state.settings, values = {};
    if (st.saving) return;
    // 送るのは、自分で書きかえた欄だけ（開いているあいだに、表のほうで変えられた欄を、古い内容にもどしてしまわないように）
    var any = false;
    for (var k in SETTING_KEYS) if (st.touched[k] && st.draft[k] !== String(D.settings[k] == null ? '' : D.settings[k])) { values[SETTING_KEYS[k]] = st.draft[k]; any = true; }
    if (!any) {                                    // 書きかえたあと、元にもどしただけ
      st.dirty = false; st.draft = null; st.touched = bag();
      render();
      toast('変更はありません。');
      return;
    }
    st.saving = true; st.message = ''; st.bad = false;
    render();
    mutate('saveSettings', { values: values }).then(function (res) {
      D.settings = res.settings;
      st.saving = false; st.dirty = false; st.draft = null; st.touched = bag();
      render();
      var m = byId('settings-msg');
      if (m && (!document.activeElement || document.activeElement === document.body)) { try { m.focus({ preventScroll: true }); } catch (e) { /* 何もしない */ } }
      toast('設定を保存しました。');
      // 目安の数字などが変わると、数えなおしが必要なものがあるので、全体を読み直す
      loadOverview().then(function () { if (view !== 'settings' || !state.settings.dirty) render(); }, function (err) { failed(err, true); });
    }, function (err) {
      st.saving = false;
      if (failed(err, true)) return;
      st.message = err.message; st.bad = true;
      render();
    });
  }
  // 「受付」のカード
  function openCard() {
    var st = state.settings, s = D.settings;
    return h('section', { class: 'card', id: 'open-card' },
      h('div', { class: 'card__head' }, h('h2', { class: 'card__title', text: '受付' })),
      h('div', { class: 'openrow' },
        h('div', {}, h('p', { class: 'openrow__state' }, h('span', { class: 'dot' + (s.open ? '' : ' dot--stop') }), s.open ? '受付中' : '停止中'),
          h('p', { class: 'field__hint', text: s.open ? '参加者はログインして回答できます。' : 'だれもログイン・回答の送信ができません。回答は参加者の端末に残り、再開すると送られます。' })),
        h('button', { type: 'button', class: 'btn' + (s.open ? ' btn--danger' : ' btn--primary'), id: 'open-toggle', disabled: st.toggling, onclick: toggleOpen }, s.open ? '受付を止める' : '受付を再開する')));
  }
  // 「受付」のカードだけを描き直す（下の入力欄は作り直さない。書いているとちゅうの文字や、日本語の変換がとぎれないように）
  function paintOpen() {
    var old = byId('open-card');
    if (view !== 'settings' || !old) { softRender(); return; }
    var mark = focusMark();
    old.parentNode.replaceChild(openCard(), old);
    paintChrome();
    focusBack(mark);
  }
  function toggleOpen() {
    var st = state.settings, open = D.settings.open;
    if (st.toggling) return;
    var go = function () {
      st.toggling = true;
      paintOpen();
      mutate('saveSettings', { values: { '受付': open ? '停止中' : '受付中' } }).then(function (res) {
        st.toggling = false;
        D.settings.open = res.settings.open;
        paintOpen();
        toast(res.settings.open ? '受付を再開しました。' : '受付を止めました。');
      }, function (err) { st.toggling = false; if (!failed(err)) paintOpen(); });
    };
    if (!open) { go(); return; }
    dialog({ title: '受付を止めますか？', body: 'すべての参加者が、ログインも回答の送信もできなくなります。書きかけ・未送信の回答は参加者の端末に残り、再開すると送られます。',
      actions: [{ label: 'やめる', value: 0 }, { label: '受付を止める', value: 1, kind: 'danger' }] }).then(function (v) { if (v === 1) go(); });
  }

  /* ============================================================
   * はじまり
   * ============================================================ */
  // メニューから開いた窓の大きさ：ブラウザの窓（わからなければ画面）に入る大きさにする
  function dialogSize() {
    var w = (window.screen && window.screen.availWidth) || 1280, hgt = (window.screen && window.screen.availHeight) || 800;
    var ow = window.outerWidth, oh = window.outerHeight;
    if (ow > 0 && ow !== window.innerWidth) w = Math.min(w, ow);
    if (oh > window.innerHeight + 10) hgt = Math.min(hgt, oh);
    return { w: Math.max(720, Math.min(1500, w - 80)), h: Math.max(420, Math.min(940, hgt - 230)) };
  }
  function start() {
    buildShell();
    // メニューから開いた窓は、画面の大きさに合わせて広げる
    if (BOOT.mode === 'dialog' && gs && gs.host && gs.host.setWidth) {
      try {
        var size = dialogSize();
        gs.host.setWidth(size.w);
        gs.host.setHeight(size.h);
      } catch (e) { /* 大きさを変えられなくても、そのまま使える */ }
    }
    firstLoad();
  }
  function firstLoad() {
    var holder = byId('view');
    holder.innerHTML = '';
    holder.appendChild(screen('読みこんでいます…', []));
    loadOverview().then(render, function (err) {
      if (failed(err, true)) return;
      holder.innerHTML = '';
      holder.appendChild(screen('読みこめませんでした',
        [err.message, 'ほかの Google アカウントにもログインしていると、うまく動かないことがあります。その場合は、ほかのアカウントからログアウトするか、シークレット ウィンドウで、このスプレッドシートの持ち主のアカウントだけにログインして開いてください。'],
        h('button', { type: 'button', class: 'btn btn--primary', onclick: firstLoad }, 'もう一度ためす'),
        err.detail || ''));
    });
  }
  // 1分ごとに、新しい内容にする（見ているあいだだけ）。
  // 何かを書いているとちゅうには、画面を描き直さない（日本語の変換がとぎれたり、書いている場所がとんだりしないように）
  var stale = false;            // 新しい内容を受け取ったが、まだ画面に出していない
  // 入力欄やリストに目印があるだけでは「書いているとちゅう」とはみなさない（えらんだあと、そのままにしていることが多いので）。
  // さいごにキーを押したり、えらんだりしてから 20 秒のあいだと、日本語の変換のとちゅうだけを「書いているとちゅう」とする
  var lastTypedAt = 0, convertingNow = false;
  function noteTyping(e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.type !== 'checkbox') lastTypedAt = Date.now();
  }
  document.addEventListener('keydown', noteTyping, true);
  document.addEventListener('input', noteTyping, true);
  document.addEventListener('pointerdown', noteTyping, true);
  document.addEventListener('compositionstart', function () { convertingNow = true; lastTypedAt = Date.now(); }, true);
  document.addEventListener('compositionend', function () { convertingNow = false; lastTypedAt = Date.now(); }, true);
  document.addEventListener('focusout', function () {
    convertingNow = false;
    // 書きおわって入力欄をはなれたら、待たせていた描き直しを行う
    if (stale) window.setTimeout(function () { if (stale && !typing()) showFresh(); }, 400);
  }, true);
  function typing() {
    var el = document.activeElement;
    if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.type === 'checkbox') { convertingNow = false; return false; }
    return convertingNow || Date.now() - lastTypedAt < 20000;
  }
  // いまの画面を描き直す。書いているとちゅうなら、あとで（書きおわってから）描き直す
  function softRender() {
    if (typing()) { stale = true; return; }
    render();
  }
  function showFresh() {
    if (blocked || dialogOpen || document.body.classList.contains('printing') || typing()) { stale = true; return; }
    stale = false;
    if (view === 'answers' && state.answers.data && !state.answers.error) {
      // 見ている一覧は、勝手には入れかえない。新しい回答が届いていたら、知らせだけ出す
      var st = state.answers;
      if (typeof st.data.all === 'number' && D.totals.rows > st.data.all && st.fresh !== D.totals.rows - st.data.all) {
        st.fresh = D.totals.rows - st.data.all;
        if (!st.loading) paintFresh();
      }
      paintChrome();
    } else {
      render();                                  // 設定の画面でも、書きかえた欄は書いたままで残る
    }
    var time = document.querySelector('.head__time');
    if (time) time.textContent = fmtClock(D.at) + ' の内容';
  }
  window.setInterval(function () {
    if (!D || blocked || document.hidden || dialogOpen || loadingOverview || document.body.classList.contains('printing')) return;
    if (state.settings.saving || state.settings.toggling || playingKey || waitingKey || typing()) return;
    if (stale) { showFresh(); return; }
    if (Date.now() - loadedAt < 55000) return;
    loadOverview(true).then(function () {
      if (overviewChanged || view === 'answers') showFresh();
      else { var time = document.querySelector('.head__time'); if (time) time.textContent = fmtClock(D.at) + ' の内容'; }
    }, function (err) { failed(err, true); });
  }, 15000);

  start();
})();
</script>
