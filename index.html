<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E6F5F9">
<meta name="robots" content="noindex">
<title>かごしま ことばさんぽ</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css?v=6">
<link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
<div id="app" class="app">
  <!-- 画面のプログラムが動くまで（または動かないとき）に見える案内 -->
  <div class="boot" id="boot">
    <p class="boot__title">かごしま ことばさんぽ</p>
    <p class="boot__msg" id="boot-msg">読みこんでいます…</p>
    <noscript>
      <p class="boot__msg">このページを使うには、ブラウザの JavaScript を「オン」にしてください。</p>
    </noscript>
  </div>
</div>
<div id="layer" class="layer"></div>

<script>
  // 数秒たっても画面が出ないときの案内（古いブラウザなど）
  window.setTimeout(function () {
    var el = document.getElementById('boot-msg');
    if (el) el.textContent = '画面を表示できませんでした。ブラウザを新しくするか、別のブラウザ（Chrome や Safari）でお試しください。';
  }, 8000);
</script>
<script src="config.js?v=6"></script>
<script src="js/util.js?v=6"></script>
<script src="js/art.js?v=6"></script>
<script src="js/demo-data.js?v=6"></script>
<script src="js/api.js?v=6"></script>
<script src="js/db.js?v=6"></script>
<script src="js/sync.js?v=6"></script>
<script src="js/recorder.js?v=6"></script>
<script src="js/screens.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
